services:
  platform-gateway:
    build:
      context: .
    image: rag-explorer-ai-platform-gateway:${PLATFORM_GATEWAY_TAG:-1.0.0}
    working_dir: /
    ports:
      - "127.0.0.1:${PLATFORM_GATEWAY_HOST_PORT:-8091}:${PLATFORM_GATEWAY_CONTAINER_PORT:-8091}"
    env_file:
      - path: .env
        required: false
    environment:
      GATEWAY_CONFIG_FILE: /config.json
    volumes:
      - type: bind
        source: ${PLATFORM_GATEWAY_CONFIG_HOST_FILE:-./config.json}
        target: /config.json
        read_only: true
        bind:
          create_host_path: false
      - ${PLATFORM_GATEWAY_LOG_HOST_DIR:-./logs}:/var/log/platform-gateway
    restart: unless-stopped
